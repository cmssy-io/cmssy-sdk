name: Examples

# Builds cmssy-io/examples against THIS checkout, packed as tarballs.
#
# `starter-smoke.yml` proves a scaffold survives; this proves the published
# example apps do. Both pack rather than link, for the same reason: a workspace
# symlink resolves differently from what a user installs, and that difference
# shipped a dead editor twice while every build was green (CMS-969, CMS-970).
#
# A build only proves an example compiles. Whether it can render the blocks its
# workspace actually sends is a separate question, and the one that failed
# silently in production - published demos served pages where every block came
# back unknown and hidden, so the status was 200 and the page was blank. The
# examples repo answers it with scripts/assert-render.mjs; which examples are
# asserted, and why the rest are not, lives in its examples.json.
#
# The examples repo is checked out ONCE, in `discover`, and every build job is
# pinned to that SHA. Its main branch is unprotected, so without the pin what
# this workflow executes could change between reading the manifest and building
# from it.

on:
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/examples.yml"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/examples.yml"
  workflow_dispatch:
    inputs:
      source:
        description: "Install the examples against packed tarballs, or the published npm packages"
        type: choice
        options: [tarballs, npm]
        default: tarballs
  # Intended to be fired after a publish, to catch the gap between "builds from
  # a tarball" and "builds from what npm actually serves". NOT WIRED YET:
  # release.yml does not dispatch it, and doing so needs a PAT or App token -
  # events raised with GITHUB_TOKEN do not start workflow runs.
  repository_dispatch:
    types: [examples-verify]

# The build steps run code from another repository. Keep the token useless to
# it, rather than relying on the repo-wide default staying read-only.
permissions:
  contents: read

concurrency:
  group: examples-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXAMPLES_REPO: cmssy-io/examples

jobs:
  pack:
    # Packing is the SDK's job, with the SDK's pnpm. Doing it inside the matrix
    # built the whole SDK once per example, and forced the examples to install
    # under whatever pnpm this repo pins - which is a different major from the
    # one they declare.
    runs-on: ubuntu-latest
    if: github.event_name != 'repository_dispatch' && github.event.inputs.source != 'npm'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Pack every published package
        run: |
          mkdir -p /tmp/pkgs
          for pkg in core eslint-plugin codemod cli react next astro remix; do
            (cd "packages/$pkg" && pnpm pack --pack-destination /tmp/pkgs)
          done
          ls /tmp/pkgs
      - uses: actions/upload-artifact@v4
        with:
          name: cmssy-tarballs
          path: /tmp/pkgs
          retention-days: 1

  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      sha: ${{ steps.read.outputs.sha }}
      source: ${{ steps.mode.outputs.source }}
    steps:
      - id: mode
        env:
          INPUT_SOURCE: ${{ github.event.inputs.source }}
          EVENT: ${{ github.event_name }}
        run: |
          source="$INPUT_SOURCE"
          if [ "$EVENT" = "repository_dispatch" ]; then source=npm; fi
          echo "source=${source:-tarballs}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EXAMPLES_REPO }}
          path: examples

      # The examples repo owns the list - adding an example there must not need
      # a commit here. It does not own the shell: `dir` and `port` are validated
      # because they reach `working-directory:` and a URL, and every entry must
      # declare either what to assert or why it cannot.
      - id: read
        working-directory: examples
        run: |
          matrix=$(node -e '
            const fs = require("fs");
            const { examples } = JSON.parse(fs.readFileSync("examples.json", "utf8"));
            if (!Array.isArray(examples) || examples.length === 0) {
              throw new Error("examples.json declares no examples");
            }
            for (const e of examples) {
              if (!/^[a-z0-9][a-z0-9-]*$/.test(e.dir ?? "")) {
                throw new Error(`bad dir: ${JSON.stringify(e.dir)}`);
              }
              if (e.buildOnly) {
                if (!e.buildOnlyReason) throw new Error(`${e.dir}: buildOnly needs buildOnlyReason`);
                continue;
              }
              if (!Array.isArray(e.assertRender) || e.assertRender.length === 0) {
                throw new Error(`${e.dir}: needs assertRender paths, or buildOnly with a reason`);
              }
              if (!e.assertRender.every((p) => typeof p === "string" && p.startsWith("/"))) {
                throw new Error(`${e.dir}: assertRender paths must start with /`);
              }
              if (!/^[0-9]{2,5}$/.test(String(e.port ?? ""))) {
                throw new Error(`${e.dir}: needs a numeric port`);
              }
            }
            console.log(JSON.stringify({ include: examples }));
          ')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  example:
    needs: [discover, pack]
    # `pack` is skipped in npm mode; `always()` keeps this from being skipped
    # with it, and the explicit result check still fails the job if packing broke.
    if: always() && needs.discover.result == 'success' && needs.pack.result != 'failure'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EXAMPLES_REPO }}
          ref: ${{ needs.discover.outputs.sha }}
          path: examples

      # The example declares its own packageManager - it is a standalone app and
      # this repo's pin is none of its business.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: examples/${{ matrix.dir }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        if: needs.discover.outputs.source == 'tarballs'
        with:
          name: cmssy-tarballs
          path: /tmp/pkgs

      # Rewrite every @cmssy/* dependency to the packed tarball, transitive ones
      # included - @cmssy/next asks npm for a @cmssy/core version that is not
      # published yet, so a direct-dependency rewrite alone resolves the old one.
      # Names with no tarball here (@cmssy/types lives in another repo) are left
      # to resolve from npm.
      - name: Point the example at those tarballs
        if: needs.discover.outputs.source == 'tarballs'
        working-directory: examples/${{ matrix.dir }}
        run: |
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync("/tmp/pkgs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tarballFor = (name) => {
              const base = "cmssy-" + name.slice("@cmssy/".length) + "-";
              const file = files.find((f) => f.startsWith(base));
              return file ? "file:/tmp/pkgs/" + file : null;
            };
            const linked = [], skipped = [];
            for (const field of ["dependencies", "devDependencies"]) {
              for (const name of Object.keys(pkg[field] ?? {})) {
                if (!name.startsWith("@cmssy/")) continue;
                const tarball = tarballFor(name);
                if (!tarball) { skipped.push(name); continue; }
                pkg[field][name] = tarball;
                linked.push(name);
              }
            }
            const overrides = {};
            for (const file of files) {
              const name = "@cmssy/" + file.replace(/^cmssy-/, "").replace(/-\d+\.\d+\.\d+.*$/, "");
              overrides[name] = "file:/tmp/pkgs/" + file;
            }
            pkg.pnpm = { ...pkg.pnpm, overrides };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log("linked:", linked.join(", ") || "(none)");
            if (skipped.length) console.log("left on npm:", skipped.join(", "));
          '

      - name: Install
        working-directory: examples/${{ matrix.dir }}
        run: pnpm install --no-frozen-lockfile

      # In npm mode the point is what the registry serves right now, so the
      # committed lockfile resolutions have to be moved off deliberately.
      - name: Take the published packages
        if: needs.discover.outputs.source == 'npm'
        working-directory: examples/${{ matrix.dir }}
        run: |
          pnpm update "@cmssy/*" --latest
          pnpm list --depth 0 | grep '@cmssy/' || true

      # These are not secrets. The demo workspace is public and its published
      # content needs no token; edit mode compares the URL's secret to the app's
      # own, so a placeholder is enough for anything this job checks. Draft
      # preview is not checked and not claimed.
      - name: Build
        working-directory: examples/${{ matrix.dir }}
        env:
          BUILD: ${{ matrix.build }}
          CMSSY_ORG_SLUG: cmssy
          CMSSY_WORKSPACE_SLUG: cmssy-demo
          CMSSY_DRAFT_SECRET: examples-ci-placeholder-draft-secret
          CMSSY_SESSION_SECRET: examples-ci-placeholder-session-secret
          # NEXT_PUBLIC_* is inlined at build time, so it has to match the port
          # the assertion will use.
          NEXT_PUBLIC_SITE_URL: http://localhost:${{ matrix.port || 3000 }}
        run: eval "$BUILD"

      # Astro reads configuration from process.env, not from a .env file, so the
      # step env is what reaches it. Nothing copies .env.example.
      - name: Assert the example renders what the workspace sends
        if: ${{ !matrix.buildOnly }}
        working-directory: examples/${{ matrix.dir }}
        env:
          START: ${{ matrix.start }}
          PORT: ${{ matrix.port }}
          PATHS: ${{ join(matrix.assertRender, ' ') }}
          CMSSY_ORG_SLUG: cmssy
          CMSSY_WORKSPACE_SLUG: cmssy-demo
          CMSSY_DRAFT_SECRET: examples-ci-placeholder-draft-secret
          CMSSY_SESSION_SECRET: examples-ci-placeholder-session-secret
          NEXT_PUBLIC_SITE_URL: http://localhost:${{ matrix.port }}
        run: |
          set -o pipefail
          eval "$START" > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          npx --yes wait-on "http://localhost:$PORT" --timeout 90000
          kill -0 "$(cat /tmp/server.pid)" 2>/dev/null || {
            echo "The server exited before it could be asked anything."
            exit 1
          }
          # shellcheck disable=SC2086
          node ../scripts/assert-render.mjs "http://localhost:$PORT" $PATHS

      - name: Server log
        if: ${{ failure() && !matrix.buildOnly }}
        run: cat /tmp/server.log || true

      - name: Note why this example is only built
        if: ${{ matrix.buildOnly }}
        env:
          DIR: ${{ matrix.dir }}
          REASON: ${{ matrix.buildOnlyReason }}
        run: printf '::notice title=%s is build-only::%s\n' "$DIR" "$REASON"
