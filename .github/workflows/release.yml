name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in core eslint-plugin codemod cli react next astro remix; do
            v=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$tag" != "$v" ]; then
              echo "::error::tag v$tag does not match @cmssy/$pkg@$v"
              exit 1
            fi
          done

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - run: pnpm -r typecheck

      - run: pnpm -r test

      - name: Publish packages
        run: |
          set -e
          for pkg in core eslint-plugin codemod cli react next astro remix; do
            cd "packages/$pkg"
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already on npm — skipping"
            else
              echo "Publishing $name@$version"
              tarball=$(pnpm pack | tail -1)
              npm publish "$tarball" --access public --provenance
            fi
            cd ../..
          done

      - name: Verify the packages are installable by anyone
        timeout-minutes: 25
        run: |
          set -e
          pending="core eslint-plugin codemod cli react next astro remix"
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            still=""
            for pkg in $pending; do
              name=$(node -p "require('./packages/$pkg/package.json').name")
              version=$(node -p "require('./packages/$pkg/package.json').version")
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
                "https://registry.npmjs.org/${name}/${version}" || echo 000)
              if [ "$code" = "200" ]; then
                echo "ok  $name@$version"
              else
                echo "waiting $name@$version — anonymous fetch returned $code"
                still="$still $pkg"
              fi
            done
            pending="$(echo $still | xargs)"
            [ -z "$pending" ] && break
            [ "$(date +%s)" -ge "$deadline" ] && break
            sleep 30
          done
          if [ -n "$pending" ]; then
            echo "::error::still not installable by anyone (non-200) after 20m: $pending"
            exit 1
          fi
          echo "all packages installable by anyone"
