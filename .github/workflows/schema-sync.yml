name: Schema sync

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schema-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh vendored SDL from production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Introspect production
        run: pnpm fetch-prod-schema
        env:
          CMSSY_API_URL: ${{ vars.CMSSY_API_URL || 'https://api.cmssy.io/graphql' }}

      - name: Detect drift
        id: drift
        run: |
          if node scripts/check-schema-drift.mjs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh the vendored SDL
        if: steps.drift.outputs.changed == 'true'
        run: cp prod-schema.graphql schema.graphql

      - name: Every SDK operation is one the refreshed SDL accepts
        if: steps.drift.outputs.changed == 'true'
        run: |
          pnpm --filter @cmssy/core test -- sdl-operations
          pnpm --filter @cmssy/cli test -- sdl-operations

      - name: Everything CI would have checked on the sync PR
        if: steps.drift.outputs.changed == 'true'
        run: |
          pnpm -r typecheck
          pnpm -r test
          pnpm check-packaging

      - name: Commit the refreshed SDL to main
        if: steps.drift.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schema.graphql
          git commit -m "chore(schema): sync vendored SDL with production"
          git push origin HEAD:main
