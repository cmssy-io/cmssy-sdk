name: Schema sync

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Refresh vendored SDL from production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Introspect production
        run: pnpm fetch-prod-schema
        env:
          CMSSY_API_URL: ${{ vars.CMSSY_API_URL || 'https://api.cmssy.io/graphql' }}

      - name: Detect drift
        id: drift
        run: |
          if node scripts/check-schema-drift.mjs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh the vendored SDL
        if: steps.drift.outputs.changed == 'true'
        run: cp prod-schema.graphql schema.graphql

      - name: Every SDK operation is one the refreshed SDL accepts
        if: steps.drift.outputs.changed == 'true'
        run: pnpm --filter @cmssy/core test -- sdl-operations

      - name: Open or update the sync PR
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # Not GITHUB_TOKEN: GitHub starts no workflow run for an event it
          # raised, so the PR's CI was created with zero jobs and died as a
          # "workflow file issue" when the branch went away (CMS-1822). Falls
          # back while the secret is absent, so the sync keeps working.
          token: ${{ secrets.SCHEMA_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          branch: schema-sync
          commit-message: "chore(schema): sync vendored SDL with production"
          title: "chore(schema): sync vendored SDL with production"
          body: |
            Automated sync: production's schema drifted from the vendored copy.

            `sdl-operations` already ran GREEN against this refreshed SDL inside the [sync workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). CI on this PR is the second opinion, not the only one.
          delete-branch: true
